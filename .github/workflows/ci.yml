name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: >-
          python -m pytest
          --cov=core.security
          --cov=core.agent_executor
          --cov=core.memory
          --cov=core.router
          --cov-report=term-missing
          --cov-fail-under=70
      - run: python -m build
      - run: python -c "import main; import core.llm_client"
