[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citadex"
version = "0.1.0"
description = "A safety-focused terminal coding copilot"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{name = "Citadex contributors"}]
dependencies = [
  "openai>=1.30,<3",
  "python-dotenv>=1.0,<2",
  "prompt-toolkit>=3.0,<4",
  "httpx>=0.27,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
citadex = "main:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests"]
